<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Homepage options · Whistle Stop Grill &amp; Bar</title>
<link rel="icon" href="../assets/logo-80.webp">
<style>
  :root { --bar: #1d1f24; --ink: #f4f4f2; --muted: #a9adb5; --pick: #ffffff; --pick-ink: #1d1f24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bar); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { position: fixed; inset: 0 0 auto 0; min-height: 56px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid #33363d; z-index: 2; }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 600; white-space: nowrap; }
  .bar h1 span { color: var(--muted); font-weight: 400; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 2px; }
  .picks::-webkit-scrollbar { display: none; }
  .picks button { flex: 0 0 auto; min-width: 38px; height: 38px; padding: 0 8px; border-radius: 999px; border: 1px solid #4a4e57; background: transparent; color: var(--ink); font: 600 14px/1 system-ui, sans-serif; cursor: pointer; }
  .picks button:hover { border-color: var(--ink); }
  .picks button[aria-pressed="true"] { background: var(--pick); color: var(--pick-ink); border-color: var(--pick); }
  .picks button:focus-visible, .open:focus-visible { outline: 2px solid #8ab4ff; outline-offset: 2px; }
  .now { margin-left: auto; display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  .now strong { font-weight: 600; }
  .open { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
  iframe { position: fixed; inset: var(--bar-h, 56px) 0 0 0; width: 100%; height: calc(100% - var(--bar-h, 56px)); border: 0; background: #fff; }
  @media (max-width: 760px) {
    .bar { height: auto; flex-wrap: wrap; padding: 8px 12px; gap: 6px 12px; }
    .bar h1 { font-size: 14px; }
    .now { margin-left: 0; width: 100%; justify-content: space-between; font-size: 13px; order: 3; }
    .picks { width: 100%; order: 2; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; padding: 4px 0; }
    .picks button { width: 100%; max-width: 40px; height: auto; aspect-ratio: 1; justify-self: center; padding: 0; font-size: 14px; }
    iframe { top: var(--bar-h, 118px); height: calc(100% - var(--bar-h, 118px)); }
  }
</style>
</head>
<body>
<header class="bar" id="bar">
  <h1>Whistle Stop <span>homepage options</span></h1>
  <nav class="picks" id="picks" aria-label="Choose a homepage design"></nav>
  <div class="now"><strong id="now-name"></strong><a class="open" id="now-open" href="1.html" target="_blank" rel="noopener">Open full page</a></div>
</header>
<iframe id="frame" title="Homepage design preview" src="1.html"></iframe>
<script>
  const designs = ["Neon Roadside", "Stack It Up", "Spin the Menu", "Patio After Dark", "Spin for Dinner", "Scroll the Patio", "Depot Board", "Frostee Harbor Diner", "Big Type", "Seven Nights", "Harbor Sky", "Incoming Train", "Pour the Mule", "Spotlight", "Plate Orbit", "Chase Lights", "Wednesday Boards", "Tap Line", "Tide on Main", "Night Lanterns", "Lantern Patio", "Warm Week", "Porch Sign", "Paper Menu", "Table for Two", "Wheel and Hour", "Kitchen Window", "Quiet After Dark", "Morning on Main", "House Favorites", "Fresh Vibe"];
  const picks = document.getElementById("picks");
  const frame = document.getElementById("frame");
  const nameEl = document.getElementById("now-name");
  const openEl = document.getElementById("now-open");
  designs.forEach((name, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(i + 1);
    b.title = name;
    b.setAttribute("aria-label", `Design ${i + 1}: ${name}`);
    b.addEventListener("click", () => show(i + 1));
    picks.appendChild(b);
  });
  function show(n, fromHash) {
    n = Math.min(designs.length, Math.max(1, n));
    frame.src = `${n}.html`;
    nameEl.textContent = `${n}. ${designs[n - 1]}`;
    openEl.href = `${n}.html`;
    [...picks.children].forEach((b, i) => b.setAttribute("aria-pressed", String(i + 1 === n)));
    picks.children[n - 1].scrollIntoView({ block: "nearest", inline: "nearest" });
    if (!fromHash) history.replaceState(null, "", `#${n}`);
    current = n;
  }
  let current = 1;
  show(Number(location.hash.slice(1)) || 1, true);
  window.addEventListener("hashchange", () => show(Number(location.hash.slice(1)) || 1, true));
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") show(current === designs.length ? 1 : current + 1);
    if (e.key === "ArrowLeft") show(current === 1 ? designs.length : current - 1);
  });
  const sizeBar = () => document.documentElement.style.setProperty("--bar-h", `${document.getElementById("bar").offsetHeight}px`);
  addEventListener("resize", sizeBar);
  sizeBar();
</script>
</body>
</html>
