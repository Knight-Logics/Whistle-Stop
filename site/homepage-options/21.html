<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 21 · Lantern Patio · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warm.css">
<style>
  .stage { position: relative; min-height: 100svh; display: grid; align-items: end; overflow: hidden; color: #fffaf3; }
  .stage .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,16,10,.18), rgba(20,16,10,.05) 42%, rgba(20,16,10,.72)); }
  .lights { position: absolute; top: 86px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 6vw; z-index: 2; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: #f0c27a; box-shadow: 0 0 12px #f0c27a; }
  .lights i:nth-child(odd) { animation-delay: -2.8s; }
  .stage .wrap { position: relative; z-index: 2; padding-bottom: 48px; }
  .stage h1 { text-shadow: 0 8px 28px rgba(0,0,0,.45); max-width: 12ch; }
  .stage .lede { color: #fff6e8; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .stage .plates { margin-top: 28px; }
  .stage .plate { color: var(--ink); }
  .stage .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .nav { position: absolute; inset: 0 0 auto; color: #fffaf3; }
  .nav ul a:hover { color: #f0c27a; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="#menu">Menu</a></li><li><a href="../events.html">This week</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="stage" aria-labelledby="h1">
    <img class="bg drift" src="../assets/gallery/WSSunset-960.webp" alt="The Whistle Stop sign at sunset on Main Street" width="960" height="1280">
    <div class="shade" aria-hidden="true"></div>
    <div class="lights" aria-hidden="true"><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i></div>
    <div class="wrap">
      <p class="status" data-ws="status">Open daily from 11 AM</p>
      <h1 id="h1">Supper under the oaks</h1>
      <p class="lede">An open-air grill on Main Street in Safety Harbor. Live music Friday and Saturday, 6:30 to 9:30.</p>
      <div class="actions"><a class="btn" href="#menu">See prices</a><a class="btn line" href="../events.html">Who's playing</a></div>
      <div class="plates">
        <article class="plate" data-plate="original"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="fgt"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="grouper-sandwich"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
      </div>
    </div>
  </section>
  <section class="menu-sec" id="menu" data-warm-menu aria-labelledby="mh">
    <div class="wrap"><h2 id="mh">The working menu</h2><p class="menu-note"></p><div class="groups"></div></div>
  </section>
  <section class="visit" id="visit"><div class="wrap" data-warm-visit></div></section>
</main>
<script src="shared.js"></script>
<script src="dawn-menu.js"></script>
<script src="warm.js"></script>
</body>
</html>
