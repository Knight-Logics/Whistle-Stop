<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 12 · Incoming Train · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;800&display=swap" rel="stylesheet">
<style>
  body { --paper: #efe4cf; --ink: #24180f; --hot: #c83b24; font-family: "Libre Franklin", system-ui, sans-serif; }
  .run { height: 210vh; background: linear-gradient(#f3d7a4, #8fb4d8 42%, #6f8f4a); }
  .run .pin { position: sticky; top: 0; height: 100svh; overflow: hidden; }
  .skyline { position: absolute; inset: auto 0 18% 0; height: 90px; background: repeating-linear-gradient(90deg, #234 0 18px, transparent 18px 70px); opacity: .25; }
  .copy { position: relative; z-index: 3; padding: 18vh 7vw 0; max-width: 680px; }
  h1 { margin: 0 0 10px; font-size: clamp(48px, 7vw, 88px); line-height: .9; letter-spacing: -.04em; }
  .tracks { position: absolute; left: 0; right: 0; bottom: 14%; height: 14px; background: repeating-linear-gradient(90deg, #5c4632 0 28px, transparent 28px 36px), linear-gradient(#3a2a1c, #3a2a1c); background-size: auto, 100% 6px; background-repeat: repeat, no-repeat; background-position: center, center; }
  .train { position: absolute; bottom: calc(14% + 10px); left: var(--x, 80%); z-index: 2; display: flex; align-items: flex-end; filter: drop-shadow(0 12px 0 rgba(0,0,0,.15)); transition: filter .2s; }
  .engine, .car { position: relative; }
  .engine { width: 150px; height: 78px; background: #c83b24; border-radius: 16px 28px 8px 8px; }
  .engine:before { content: ""; position: absolute; left: -36px; bottom: 8px; width: 42px; height: 36px; background: #2b2b2b; border-radius: 8px 0 0 8px; }
  .stack { position: absolute; right: 22px; top: -22px; width: 18px; height: 26px; background: #222; border-radius: 3px; }
  .puff { position: absolute; right: 8px; top: -46px; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.8); animation: puff 1.4s ease-out infinite; }
  .puff:nth-child(2) { animation-delay: .4s; right: 22px; }
  .puff:nth-child(3) { animation-delay: .8s; right: -2px; }
  @keyframes puff { from { transform: translateY(0) scale(.4); opacity: .9; } to { transform: translateY(-36px) scale(1.6); opacity: 0; } }
  .car { width: 108px; height: 64px; margin-left: 8px; background: #f4e2b0; border: 3px solid #24180f; border-radius: 8px; }
  .wheel { position: absolute; bottom: -12px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #d8d2c4 0 4px, #222 5px); animation: spin .45s linear infinite; }
  .engine .wheel:first-of-type { left: 18px; } .engine .wheel:last-of-type { right: 16px; }
  .car .wheel { left: 14px; } .car .wheel + .wheel { left: auto; right: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lights { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); display: flex; gap: 28px; z-index: 3; }
  .lights i { width: 22px; height: 22px; border-radius: 50%; background: #3a120c; box-shadow: 0 0 0 4px #24180f; }
  html.moving .lights i:first-child { animation: blink .6s steps(1) infinite; }
  html.moving .lights i:last-child { animation: blink .6s steps(1) infinite .3s; }
  @keyframes blink { 50% { background: #ff2a1a; box-shadow: 0 0 18px #ff2a1a; } }
  html.still .wheel, html.still .puff { animation: none; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../menu.html">Menu</a></li><li><a href="../events.html">This week</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="run" id="run" aria-labelledby="h1">
    <div class="pin">
      <div class="lights" aria-hidden="true"><i></i><i></i></div>
      <div class="copy">
        <h1 id="h1" data-split>All aboard Main Street.</h1>
        <p>The whistle still means pull over. Burgers from $8.90, 18 taps, and a patio that fills up when the music starts.</p>
        <p data-ws="status">Open daily from 11 AM</p>
      </div>
      <div class="skyline" aria-hidden="true"></div>
      <div class="train" id="train" aria-hidden="true">
        <div class="engine"><i class="stack"></i><i class="puff"></i><i class="puff"></i><i class="puff"></i><i class="wheel"></i><i class="wheel"></i></div>
        <div class="car"><i class="wheel"></i><i class="wheel"></i></div>
        <div class="car"><i class="wheel"></i><i class="wheel"></i></div>
      </div>
      <div class="tracks" aria-hidden="true"></div>
    </div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script>
FX.progress(document.getElementById("run"), "pin", function (p) {
  document.getElementById("train").style.setProperty("--x", ((1 - p) * 110 - 8).toFixed(1) + "%");
});
</script>
</body>
</html>
