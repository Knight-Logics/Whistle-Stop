<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Option 7 · Porch Sign · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warm.css">
<style>
  .sign-wrap { min-height: 100svh; display: grid; place-items: center; padding: 110px 20px 64px; background: radial-gradient(circle at 50% 20%, #2a4034, #101a16 72%); }
  .sign { width: min(720px, 100%); text-align: center; padding: 28px 22px 34px; border-radius: 28px; background: #1c140e; color: #f8ecd8; box-shadow: 0 0 0 12px #5a3a24, 0 24px 50px rgba(0,0,0,.35); }
  .bulbs { display: flex; justify-content: center; gap: 14px; margin-bottom: 18px; }
  .bulbs i { width: 14px; height: 14px; border-radius: 50%; background: #f0c27a; box-shadow: 0 0 10px #f0c27a; }
  .bulbs i:nth-child(3n) { animation-delay: -1.8s; }
  .bulbs i:nth-child(3n+1) { animation-delay: -3.6s; }
  h1 { margin: 0; font-size: clamp(40px, 6vw, 68px); color: #f0c27a; }
  .tag { margin: 8px 0 0; font-size: 22px; }
  .sign .plates { text-align: left; margin-top: 22px; grid-template-columns: 1fr; }
  .sign .plate { background: #2a1c14; color: #f8ecd8; box-shadow: none; }
</style>
</head>
<body data-theme="night">
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="#menu">Menu</a></li><li><a href="../about.html">Our story</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="sign-wrap" aria-labelledby="h1">
    <div class="sign">
      <div class="bulbs" aria-hidden="true"><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i></div>
      <h1 id="h1">Real. Good. Food.</h1>
      <p class="tag">Since 1995</p>
      <p>The line from the menu, on a porch sign. The bulbs glow in place.</p>
      <p class="status" data-ws="status">Open daily from 11 AM</p>
      <div class="plates">
        <article class="plate" data-plate="fish-spread"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="blfgt"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="steak-frites"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
      </div>
    </div>
  </section>
  <section class="menu-sec" id="menu" data-warm-menu><div class="wrap"><h2>The working menu</h2><p class="menu-note"></p><div class="groups"></div></div></section>
  <section class="visit" id="visit"><div class="wrap" data-warm-visit></div></section>
</main>
<script src="shared.js"></script>
<script src="dawn-menu.js"></script>
<script src="warm.js"></script>
</body>
</html>
