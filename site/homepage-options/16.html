<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 16 · Chase Lights · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Outfit:wght@400;650&display=swap" rel="stylesheet">
<style>
  body { --paper: #1a1024; --ink: #fff6e8; --hot: #ffb703; --card: #2a1840; --line: rgba(255,255,255,.12); --muted: #ecdcb8; font-family: Outfit, system-ui, sans-serif; }
  h1, h2 { font-family: "Bowlby One", system-ui, sans-serif; letter-spacing: .02em; }
  .btn { color: #1a1024; } .btn.line { color: #fff6e8; }
  .marquee { min-height: 100svh; display: grid; place-items: center; padding: 18vh 6vw 8vh; background: radial-gradient(circle at 50% 30%, #3a2158, #120814 70%); }
  .sign { width: min(760px, 100%); padding: 28px 22px 32px; border-radius: 28px; background: #140c1c; box-shadow: 0 0 0 10px #2a1838, 0 30px 60px rgba(0,0,0,.35); text-align: center; }
  .bulbs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 18px; }
  .bulb { width: 16px; height: 16px; border-radius: 50%; background: #3a2a18; box-shadow: inset 0 0 0 2px #6a5030; }
  .bulb.on { background: #ffe08a; box-shadow: 0 0 12px #ffd15a, 0 0 24px rgba(255, 180, 40, .8); }
  h1 { margin: 0; font-size: clamp(40px, 7vw, 78px); color: #ffe7a3; text-shadow: 0 0 12px rgba(255, 196, 60, .8); }
  h1 span { display: inline-block; animation: letter 2.4s ease-in-out infinite; }
  h1 span:nth-child(2) { animation-delay: .15s; } h1 span:nth-child(3) { animation-delay: .3s; }
  @keyframes letter { 0%, 70%, 100% { opacity: 1; } 78% { opacity: .25; } 84% { opacity: 1; } 88% { opacity: .4; } }
  .sub { color: #ffd0e6; font-size: 22px; text-shadow: 0 0 10px rgba(255, 80, 140, .7); }
  html.still h1 span { animation: none; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../menu.html">Menu</a></li><li><a href="../events.html">This week</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="marquee" aria-labelledby="h1">
    <div class="sign">
      <div class="bulbs" id="bulbs" aria-hidden="true"></div>
      <h1 id="h1"><span>Whistle</span> <span>Stop</span> <span>Grill</span></h1>
      <p class="sub">Old Florida / New Vibe</p>
      <p>915 Main Street, Safety Harbor. Open from 11 AM. The sign has been on this corner since the drive-in days.</p>
      <p><a class="btn" href="../about.html">Our story</a> <a class="btn line" href="../menu.html">Menu</a></p>
      <p data-ws="status">Open daily from 11 AM</p>
    </div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var box = document.getElementById("bulbs");
  var bulbs = [];
  for (var i = 0; i < 28; i++) {
    var b = document.createElement("i");
    b.className = "bulb";
    box.appendChild(b);
    bulbs.push(b);
  }
  FX.loop(function (t) {
    var on = Math.floor(t * 14) % bulbs.length;
    bulbs.forEach(function (el, i) {
      var d = (i - on + bulbs.length) % bulbs.length;
      el.classList.toggle("on", d < 4);
    });
  });
})();
</script>
</body>
</html>
