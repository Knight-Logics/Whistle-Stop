<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 19 · Tide on Main · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Outfit:wght@400;650&display=swap" rel="stylesheet">
<style>
  body { --paper: #e7f6ff; --ink: #123044; --hot: #e25b2a; font-family: Outfit, system-ui, sans-serif; }
  h1, h2 { font-family: Fraunces, Georgia, serif; }
  .tide { position: relative; min-height: 100svh; overflow: hidden; background: linear-gradient(#9fd8ff, #e7f6ff 55%, #1f6f93); }
  .tide canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .waves { position: absolute; left: -10%; right: -10%; bottom: 0; height: 38%; }
  .waves i { position: absolute; left: 0; right: 0; height: 80px; background: radial-gradient(circle at 20px 0, transparent 20px, rgba(255,255,255,.45) 21px) left / 40px 20px repeat-x, linear-gradient(#7ec8ea, transparent); animation: wave 6s linear infinite; }
  .waves i:nth-child(2) { bottom: 30px; opacity: .7; animation-duration: 9s; animation-direction: reverse; }
  .waves i:nth-child(3) { bottom: 70px; opacity: .45; animation-duration: 12s; }
  @keyframes wave { to { background-position: 40px 0, 0 0; } }
  .copy { position: relative; z-index: 2; padding: 22vh 7vw 30vh; max-width: 820px; }
  h1 { margin: 0; font-size: clamp(64px, 12vw, 140px); line-height: .84; letter-spacing: -.04em; }
  .reflect { display: block; transform: scaleY(-1); opacity: .35; filter: blur(0.4px); mask-image: linear-gradient(#000, transparent 70%); }
  html.still .waves i { animation: none; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../menu.html">Menu</a></li><li><a href="../events.html">This week</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="tide" id="tide" aria-labelledby="h1">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="copy">
      <h1 id="h1">Main Street<span class="reflect" aria-hidden="true">Main Street</span></h1>
      <p>Safety Harbor's open-air grill and bar, a block from the water. Scroll and the sun walks across the afternoon while the birds keep going.</p>
      <p data-ws="status">Open daily from 11 AM</p>
    </div>
    <div class="waves" aria-hidden="true"><i></i><i></i><i></i></div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script src="sky.js"></script>
<script>
(function () {
  var sky = WSSky.attach(document.getElementById("sky"), { birds: 6, trees: false, sun: true, gleam: true, leaves: false, clouds: true, gusts: true });
  FX.progress(document.getElementById("tide"), "pass", function (p) { sky.setSun(0.12 + p * 0.35); });
})();
</script>
</body>
</html>
