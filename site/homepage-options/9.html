<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 9 · Table for Two · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warm.css">
<style>
  .split { display: grid; grid-template-columns: 1.05fr .95fr; min-height: calc(100svh - 76px); }
  .photo { position: relative; overflow: hidden; min-height: 420px; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .copy { padding: 48px 6vw 40px; display: flex; flex-direction: column; justify-content: center; }
  .copy h1 { margin: 0 0 10px; font-size: clamp(42px, 5vw, 68px); }
  .rows { margin-top: 18px; }
  .rows .item { background: transparent; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } .photo { min-height: 280px; } .photo img { position: relative; height: 280px; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="#menu">Menu</a></li><li><a href="../events.html">This week</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="split" aria-labelledby="h1">
    <div class="photo"><img class="drift" src="../assets/gallery/WSDrinks.webp" alt="Friends raising glasses at a long table" width="1280" height="878"></div>
    <div class="copy">
      <p class="status" data-ws="status">Open daily from 11 AM</p>
      <h1 id="h1">Pull up a chair</h1>
      <p class="lede">Tonight is <span data-ws="tonight">Live music</span>, <span data-ws="tonight-time"></span>. Prices are from the working menu.</p>
      <div class="rows">
        <div class="item" data-plate="original"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
        <div class="item" data-plate="blfgt"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
        <div class="item" data-plate="fish-spread"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
        <div class="item" data-plate="harbor-tacos"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
        <div class="item" data-plate="cobb"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
        <div class="item" data-plate="mac"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div><p class="item-detail" data-field="detail"></p></div>
      </div>
    </div>
  </section>
  <section class="menu-sec" id="menu" data-warm-menu><div class="wrap"><h2>The working menu</h2><p class="menu-note"></p><div class="groups"></div></div></section>
  <section class="visit" id="visit"><div class="wrap" data-warm-visit></div></section>
</main>
<script src="shared.js"></script>
<script src="dawn-menu.js"></script>
<script src="warm.js"></script>
</body>
</html>
