<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Option 13 · Morning on Main · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warm.css">
<style>
  .morning { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100svh - 76px); }
  .morning .photo { min-height: 420px; overflow: hidden; }
  .morning img { width: 100%; height: 100%; object-fit: cover; }
  .morning .copy { padding: 48px 6vw; display: flex; flex-direction: column; justify-content: center; background: #f3e2c4; }
  .morning h1 { margin: 8px 0 12px; font-size: clamp(44px, 5.4vw, 72px); }
  @media (max-width: 800px) { .morning { grid-template-columns: 1fr; } .morning img { height: 280px; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="#menu">Menu</a></li><li><a href="../events.html">Sunday</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="morning" aria-labelledby="h1">
    <div class="photo"><img src="../assets/gallery/WSDrinks2.webp" alt="The open-air patio by daylight" width="810" height="1280"></div>
    <div class="copy">
      <p class="status" data-ws="status">Open daily from 11 AM</p>
      <h1 id="h1">Morning on Main</h1>
      <p class="lede">Doors at 11. Sunday is Bloody Mary Sunday: $5 mimosas and Bloody Marys on the patio. The plates below are from the menu you sent.</p>
      <div class="plates">
        <article class="plate" data-plate="cobb"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="kale-caesar"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
        <article class="plate" data-plate="goodness"><h3 data-field="name"></h3><p class="detail" data-field="detail"></p><b class="price" data-field="price"></b></article>
      </div>
    </div>
  </section>
  <section class="menu-sec" id="menu" data-warm-menu><div class="wrap"><h2>The working menu</h2><p class="menu-note"></p><div class="groups"></div></div></section>
  <section class="visit" id="visit"><div class="wrap" data-warm-visit></div></section>
</main>
<script src="shared.js"></script>
<script src="dawn-menu.js"></script>
