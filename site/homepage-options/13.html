<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 13 · Pour the Mule · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,620&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { --paper: #10241c; --ink: #f4ffe8; --hot: #d6ff57; --card: #183428; --line: rgba(255,255,255,.12); --muted: #c5d8bc; font-family: Outfit, system-ui, sans-serif; }
  h1, h2 { font-family: Fraunces, Georgia, serif; color: #f6ffd8; }
  .btn { color: #10241c; } .btn.line { color: #f4ffe8; }
  .build { height: 200vh; }
  .build .pin { position: sticky; top: 0; height: 100svh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 20px; padding: 10vh 6vw 6vh; overflow: hidden; }
  h1 { font-size: clamp(46px, 6vw, 80px); line-height: .92; margin: 0 0 12px; }
  .stage { height: min(70vh, 520px); display: grid; place-items: center; perspective: 800px; }
  .glass { position: relative; width: 180px; height: 340px; border: 4px solid rgba(255,255,255,.75); border-top: 0; border-radius: 8px 8px 36px 36px; background: linear-gradient(90deg, rgba(255,255,255,.18), transparent 30%, rgba(255,255,255,.12)); overflow: hidden; transform: rotateY(calc(var(--tilt, 0) * 1deg)); }
  .liquid { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--fill, .15) * 92%); background: linear-gradient(#f2c14d, #d98a1a 40%, #c4522a); transform-origin: bottom; animation: slosh 2.8s ease-in-out infinite; }
  @keyframes slosh { 50% { transform: skewX(4deg) translateX(3px); } }
  .foam { position: absolute; left: -8%; right: -8%; top: -12px; height: 22px; background: #fff6d8; border-radius: 50%; }
  .ice { position: absolute; width: 36px; height: 36px; background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.8); border-radius: 6px; top: calc(70% - var(--fill, 0) * 50%); animation: bob 2.2s ease-in-out infinite; }
  .ice.a { left: 28px; } .ice.b { right: 32px; animation-delay: .4s; transform: rotate(18deg); }
  @keyframes bob { 50% { translate: 0 -6px; } }
  .lime { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(#d9f28f, #6fae2c, #d9f28f); right: -10px; top: 46px; opacity: var(--in, 0); transform: scale(var(--in, 0)) rotate(calc(var(--in, 0) * 120deg)); }
  .gleam { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.7) 48%, transparent 60%); background-size: 220% 100%; animation: shine 2.6s ease-in-out infinite; mix-blend-mode: screen; }
  @keyframes shine { from { background-position: 120% 0; } to { background-position: -40% 0; } }
  .straw { position: absolute; width: 8px; height: 180px; background: #d6ff57; right: 48px; top: -30px; border-radius: 4px; transform: rotate(12deg); }
  html.still .liquid, html.still .ice, html.still .gleam { animation: none; }
  @media (max-width: 800px) { .build .pin { grid-template-columns: 1fr; padding-top: 16vh; } .stage { height: 280px; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../menu.html#bar-cocktails">Cocktails</a></li><li><a href="../happy-hour.html">Happy hour</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="build" id="build" aria-labelledby="h1">
    <div class="pin">
      <div>
        <h1 id="h1" data-split>Watch it get built.</h1>
        <p>The Old Florida Mule is $9. Half-off martinis on Monday. Happy hour every day from 4 to 7, and until close on Tuesday and Wednesday.</p>
        <p><a class="btn" href="../menu.html#bar-cocktails">See the cocktails</a></p>
        <p data-ws="status">Open daily from 11 AM</p>
      </div>
      <div class="stage" id="stage">
        <div class="glass" aria-hidden="true">
          <div class="liquid"><i class="foam"></i></div>
          <i class="ice a"></i><i class="ice b"></i>
          <i class="lime" id="lime"></i>
          <i class="straw"></i>
          <i class="gleam"></i>
        </div>
      </div>
    </div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script>
var root = document.documentElement;
var stage = document.getElementById("stage");
FX.progress(document.getElementById("build"), "pin", function (p) {
  root.style.setProperty("--fill", FX.smooth(0.02, 0.62, p).toFixed(3));
  root.style.setProperty("--in", FX.smooth(0.48, 0.78, p).toFixed(3));
});
if (FX.fine && !FX.reduce) {
  stage.addEventListener("pointermove", function (e) {
    var r = stage.getBoundingClientRect();
    root.style.setProperty("--tilt", ((e.clientX - r.left) / r.width - 0.5) * 16);
  });
}
</script>
</body>
</html>
