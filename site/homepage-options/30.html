<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 30 · House Favorites · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Lilita+One&family=Nunito:wght@400;600;700;800&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="warm.css">
<style>
  .bar30 { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; height: 78px; padding: 0 28px; background: #0b0b0b; color: #fff; font-family: Outfit, Nunito, sans-serif; }
  .brand30 { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .brand30 svg { width: 44px; height: 44px; flex: none; }
  .lockup { display: flex; flex-direction: column; line-height: 1; }
  .lockup strong { font-family: "Lilita One", Nunito, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: .01em; }
  .lockup i { display: block; height: 3px; margin: 4px 0 5px; border-radius: 2px; background: #e4c15a; }
  .lockup em { font-style: normal; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
  .bar30 nav { display: flex; gap: 26px; margin-left: auto; }
  .bar30 nav a { color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; }
  .bar30 nav a:hover { color: #e4c15a; }
  .order30 { margin-left: 8px; padding: 10px 18px; border: 2px solid #e4c15a; border-radius: 999px; color: #f4e7b4; font-weight: 800; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
  .order30:hover { background: #e4c15a; color: #111; }
  .stage30 { min-height: calc(100svh - 78px); background: #101510; display: flex; align-items: flex-start; justify-content: center; }
  .art-hero { width: min(100%, calc((100svh - 78px) * 1024 / 515)); margin: 0; }
  .art-hero img { display: block; width: 100%; height: auto; max-width: none; }
  @media (max-width: 860px) {
    .bar30 { flex-wrap: wrap; height: auto; min-height: 0; padding: 12px 16px; }
    .bar30 nav { order: 3; width: 100%; margin: 0; justify-content: space-between; gap: 10px; overflow-x: auto; }
    .order30 { margin-left: auto; }
    .stage30 { min-height: calc(100svh - 132px); }
    .art-hero { width: min(100%, calc((100svh - 132px) * 1024 / 515)); }
  }
  .house { padding: 28px 0 10px; }
  .house .wrap { display: grid; grid-template-columns: .8fr 1.2fr; gap: 28px; align-items: center; }
  .house h1 { margin: 8px 0 8px; font-size: clamp(42px, 5vw, 68px); }
  .card { background: var(--card); border-radius: 22px; padding: 8px 22px 12px; }
  @media (max-width: 800px) { .house .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="bar30">
  <a class="brand30" href="../index.html">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 8h36L28 28v8h6v4H14v-4h6v-8L6 8z" fill="#d6f25c"/><path d="M18 16c6 2 10 2 14-1" fill="none" stroke="#0b0b0b" stroke-width="1.6" stroke-linecap="round" opacity=".45"/></svg>
    <span class="lockup"><strong>Whistle Stop</strong><i></i><em>Grill &amp; Bar</em></span>
  </a>
  <nav aria-label="Primary">
    <a href="../menu.html">Menu</a>
    <a href="../events.html">Events</a>
    <a href="../private-events.html">Gatherings</a>
    <a href="../about.html">About</a>
    <a href="#visit">Visit</a>
  </nav>
  <a class="order30" href="../order.html">Order online</a>
</header>
<main>
  <div class="stage30">
  <section class="art-hero" aria-label="Old Florida, fresh vibe">
    <img src="../assets/gallery/ws-old-florida-hero.jpg?v=4" alt="Whistle Stop Grill and Bar at sunset, with the patio, string lights, and palms" width="1024" height="515">
  </section>
  </div>
  <section class="house" aria-labelledby="h1"><div class="wrap">
    <div>
      <p class="status" data-ws="status">Open daily from 11 AM</p>
      <h1 id="h1">House favorites</h1>
      <p class="lede">Eight plates from the working menu, at the size you'd read at the table.</p>
    </div>
    <div class="card">
      <div class="item" data-plate="fgt"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="fish-spread"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="original"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="blfgt"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="grouper-sandwich"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="harbor-tacos"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="faroe"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
      <div class="item" data-plate="steak-frites"><div class="item-name" data-field="name"></div><div class="item-price" data-field="price"></div></div>
    </div>
  </div></section>
  <section class="menu-sec" id="menu" data-warm-menu><div class="wrap"><h2>The working menu</h2><p class="menu-note"></p><div class="groups"></div></div></section>
  <section class="visit" id="visit"><div class="wrap" data-warm-visit></div></section>
</main>
<script src="shared.js"></script>
<script src="dawn-menu.js"></script>
<script src="warm.js"></script>
</body>
</html>
