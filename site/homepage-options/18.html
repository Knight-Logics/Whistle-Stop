<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 18 · Tap Line · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  body { --paper: #1b140c; --ink: #fff4df; --hot: #f2b632; --card: #2a1d12; --line: rgba(255,255,255,.12); --muted: #e6d3b0; font-family: Outfit, system-ui, sans-serif; }
  .btn { color: #1b140c; } .btn.line { color: #fff4df; }
  .barback { min-height: 100svh; padding: 18vh 5vw 8vh; background: radial-gradient(circle at 50% 0%, #4a3018, #1b140c 55%); }
  h1 { margin: 0 0 8px; font-size: clamp(46px, 7vw, 84px); letter-spacing: -.04em; line-height: .9; }
  .wall { margin-top: 28px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; }
  .tap { text-align: center; color: #fff4df; font-size: 12px; font-weight: 800; }
  .handle { width: 22px; height: 84px; margin: 0 auto 8px; border-radius: 12px 12px 4px 4px; background: linear-gradient(#f4e2b0, #c9832a); transform-origin: bottom center; transform: rotate(calc(var(--pull, 0) * 42deg)); box-shadow: inset -4px 0 0 rgba(0,0,0,.2); }
  .stream { width: 8px; height: 90px; margin: -6px auto 0; background: linear-gradient(#f2b632, rgba(242,182,50,0)); transform: scaleY(var(--pull, 0)); transform-origin: top; border-radius: 0 0 8px 8px; }
  .bubbles i { display: block; width: 6px; height: 6px; margin: 4px auto; border-radius: 50%; background: rgba(255,255,255,.7); animation: rise 1.6s linear infinite; }
  .bubbles i:nth-child(2) { animation-delay: .4s; } .bubbles i:nth-child(3) { animation-delay: .8s; }
  @keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(-28px); opacity: 1; } }
  html.still .bubbles i { animation: none; }
  @media (max-width: 800px) { .wall { grid-template-columns: repeat(4, 1fr); gap: 16px 8px; } }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../menu.html#bar-beer">Beer</a></li><li><a href="../happy-hour.html">Happy hour</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="barback" id="taps" aria-labelledby="h1">
    <h1 id="h1" data-split>Eighteen taps. Pull one.</h1>
    <p>Domestic drafts from $4.50, Florida craft on rotation, and a flight of four. Scroll and the handles come down one at a time.</p>
    <div class="wall" id="wall"></div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var names = ["Domestic", "Craft", "Local", "Flight", "Domestic", "Craft", "Local", "Flight"];
  var wall = document.getElementById("wall");
  wall.innerHTML = names.map(function (n) {
    return '<div class="tap"><div class="handle"></div><div class="stream"></div><div class="bubbles" aria-hidden="true"><i></i><i></i><i></i></div>' + n + "</div>";
  }).join("");
  var taps = Array.prototype.slice.call(wall.children);
  FX.progress(document.getElementById("taps"), "pass", function (p) {
    taps.forEach(function (tap, i) {
      var local = FX.smooth(0.08 + i * 0.08, 0.2 + i * 0.08, p);
      tap.style.setProperty("--pull", local.toFixed(3));
    });
  });
})();
</script>
</body>
</html>
