<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Option 17 · Wednesday Boards · Whistle Stop Grill &amp; Bar</title>
<base target="_top">
<link rel="stylesheet" href="kit.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
<style>
  body { --paper: #f3efe4; --ink: #243024; --hot: #2f7d32; font-family: Outfit, system-ui, sans-serif; }
  .yard { height: 200vh; background: linear-gradient(#d7ecff, #b7d98a 40%, #6a9a45); }
  .yard .pin { position: sticky; top: 0; height: 100svh; overflow: hidden; }
  .copy { padding: 16vh 7vw 0; max-width: 640px; position: relative; z-index: 2; }
  h1 { margin: 0 0 8px; font-size: clamp(46px, 6vw, 78px); line-height: .92; letter-spacing: -.04em; }
  .lawn { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; }
  .board { position: absolute; bottom: 10%; width: min(280px, 40vw); height: 140px; background: linear-gradient(#e7c27a, #c48a3a); border: 8px solid #6b4320; border-radius: 8px; transform: perspective(500px) rotateX(28deg); }
  .board.near { right: 8%; } .board.far { left: 14%; bottom: 24%; transform: perspective(500px) rotateX(34deg) scale(.8); }
  .hole { position: absolute; right: 18px; top: 16px; width: 42px; height: 42px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #3a2412, #120c08 70%); box-shadow: inset 0 4px 0 rgba(255,255,255,.2); }
  .bag { position: absolute; left: 8%; bottom: 8%; width: 46px; height: 46px; border-radius: 8px; background: #e25b2a; z-index: 3; box-shadow: 0 8px 0 rgba(0,0,0,.15); }
  .bag.b { background: #1d4e89; } .bag.c { background: #f2b632; } .bag.d { background: #f4f4f2; }
  .score { position: absolute; right: 8%; bottom: 46%; font-size: 42px; font-weight: 800; opacity: 0; transform: translateY(10px); }
  .score.show { opacity: 1; transform: none; transition: .3s; }
</style>
</head>
<body>
<header class="nav"><div class="wrap">
  <a class="brand" href="../index.html"><img src="../assets/logo-160.webp" alt="" width="44" height="44"><span>Whistle Stop Grill &amp; Bar</span></a>
  <ul><li><a href="../events.html">This week</a></li><li><a href="../happy-hour.html">Happy hour</a></li><li><a href="#visit">Visit</a></li></ul>
  <a class="btn" href="../order.html">Order online</a>
</div></header>
<main>
  <section class="yard" id="yard" aria-labelledby="h1">
    <div class="pin">
      <div class="copy">
        <h1 id="h1" data-split>Cornhole every Wednesday.</h1>
        <p>Boards come out at 6 PM. Happy hour is already on, from 4 PM to close. Scroll and toss a bag.</p>
        <p data-ws="status">Open daily from 11 AM</p>
      </div>
      <div class="lawn">
        <div class="board far" aria-hidden="true"><i class="hole"></i></div>
        <div class="board near" aria-hidden="true"><i class="hole"></i></div>
        <i class="bag a"></i><i class="bag b"></i><i class="bag c"></i><i class="bag d"></i>
        <div class="score" id="score">In the hole</div>
      </div>
    </div>
  </section>
  <div id="rest"></div>
</main>
<script src="shared.js"></script>
<script src="food.js"></script>
<script src="fx.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var bags = Array.prototype.slice.call(document.querySelectorAll(".bag"));
  var score = document.getElementById("score");
  FX.progress(document.getElementById("yard"), "pin", function (p) {
    var sunk = 0;
    bags.forEach(function (bag, i) {
      var local = FX.clamp(p * bags.length - i);
      var x = local * (innerWidth * 0.55);
      var y = -Math.sin(local * Math.PI) * 180;
      var rot = local * 50 * (i % 2 ? 1 : -1);
      bag.style.transform = "translate(" + x.toFixed(0) + "px, " + y.toFixed(0) + "px) rotate(" + rot.toFixed(1) + "deg)";
      if (local > 0.92) sunk++;
    });
    score.classList.toggle("show", sunk > 0);
    score.textContent = sunk + (sunk === 1 ? " in the hole" : " in the hole");
  });
})();
</script>
</body>
</html>
