name: Whistle Stop campaign hourly runner

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whistle-stop-campaign-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one compliance-checked campaign batch
        env:
          WS_CAMPAIGN_RUNNER_KEY: ${{ secrets.WS_CAMPAIGN_RUNNER_KEY }}
        run: |
          if [ -z "$WS_CAMPAIGN_RUNNER_KEY" ]; then
            echo "::warning::WS_CAMPAIGN_RUNNER_KEY is not configured; the campaign runner remains safely inactive."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -H "X-WS-Runner-Key: $WS_CAMPAIGN_RUNNER_KEY" \
            "https://knightlogics.com/api/whistle-stop-social?service=campaigns&route=run-hourly"
